<script>
(() => {
const URL="https://phhwrfqlswvhfsdymnin.supabase.co";
const KEY="sb_publishable_WmTdaMTqr5AKzPMOZYADaA_pUASFYnO";
const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});
let students=[],events=[],activePanel="",cachedDashboard=null;
const $=id=>document.getElementById(id);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
function msg(el,text,type="ok"){el.textContent=text;el.className="msg "+type}
function clearMsg(el){el.textContent="";el.className="msg"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(){const d=new Date();return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}
async function invoke(fn,body){
 const {data,error}=await sb.functions.invoke(fn,{body});
 if(error){let m=error.message||"Request failed";try{const j=await error.context.json();m=j.error||m}catch(_){}throw new Error(m)}
 if(data?.success===false)throw new Error(data.error||"Request failed");
 return data?.data!==undefined?data.data:data;
}
async function api(body){return invoke("amu-api",body)}
async function reports(body){return invoke("amu-reports",body)}
function pinPrompt(){const p=prompt("Enter your Common PIN to authorize this financial transaction:");if(p===null)return null;if(!/^\d{4,12}$/.test(p)){alert("PIN must contain 4–12 digits.");return null}return p}
const panelStack=[];let panelHistoryActive=false;let pendingRestorePayload=null;
function showPanel(key,title,html){
 const panel=$("panel");
 if(panel.classList.contains("show")){
  const oldTitle=$("panelTitle").textContent;
  if(key!==activePanel||title!==oldTitle){panelStack.push({key:activePanel,title:oldTitle,html:$("panelBody").innerHTML,message:$("panelMsg").textContent,messageClass:$("panelMsg").className});history.pushState({amuPanel:true},"",location.pathname+location.search+"#amu-panel");}
 }else{panelHistoryActive=true;history.pushState({amuPanel:true},"",location.pathname+location.search+"#amu-panel");}
 document.querySelectorAll(".mini-modal").forEach(modal=>modal.remove());
 activePanel=key;$("panelTitle").textContent=title;$("panelBody").innerHTML=html;panel.classList.add("show");clearMsg($("panelMsg"));panel.scrollTop=0
}
function restorePanel(snapshot){activePanel=snapshot.key;$("panelTitle").textContent=snapshot.title;$("panelBody").innerHTML=snapshot.html;$("panelMsg").textContent=snapshot.message;$("panelMsg").className=snapshot.messageClass;$("panel").scrollTop=0}
function openMiniModal(modal){
 if(!modal||modal.classList.contains("show"))return;
 modal.classList.add("show");
 history.pushState({amuMiniModal:true},"",location.pathname+location.search+location.hash);
}
function closeMiniModal(modal){
 if(!modal||!modal.classList.contains("show"))return;
 if(history.state&&history.state.amuMiniModal){history.back();}
 else{modal.classList.remove("show");}
}
window.addEventListener("popstate",()=>{
 const openMini=[...document.querySelectorAll(".mini-modal.show")].pop();
 if(openMini){openMini.classList.remove("show");return;}
 if(panelStack.length){restorePanel(panelStack.pop());return;}
 if($("panel").classList.contains("show")){$("panel").classList.remove("show");activePanel="";panelHistoryActive=false;}
});
function closeTopPanel(){if($("panel").classList.contains("show")){history.back();}}

function downloadTextFile(filename,content,mime){
 const blob=new Blob([content],{type:mime});
 let href="data:"+mime+";charset=utf-8,"+encodeURIComponent(content),objectUrl=null;
 try{if(window.URL&&typeof window.URL.createObjectURL==="function"){objectUrl=window.URL.createObjectURL(blob);href=objectUrl}}catch(_){ }
 const a=document.createElement("a");a.href=href;a.download=filename;a.style.display="none";document.body.appendChild(a);
 try{a.click()}finally{a.remove();if(objectUrl&&window.URL&&typeof window.URL.revokeObjectURL==="function")setTimeout(()=>window.URL.revokeObjectURL(objectUrl),1500)}
}
function csvField(value){const text=String(value??"");return '"'+text.replace(/"/g,'""')+'"'}
function downloadCurrentBalances(){
 const rows=balanceRows();
 const lines=[["Student","Student ID","Class","Current Balance (INR)"],...rows.map(r=>[r.name,r.student_code,r.class,Number(r.current_balance||0).toFixed(2)])];
 const csv="\uFEFF"+lines.map(row=>row.map(csvField).join(",")).join("\r\n");
 downloadTextFile("MSPS_Current_Balances_"+today()+".csv",csv,"text/csv");
 msg($("panelMsg"),"Current balances CSV download started. Check your Downloads folder.","ok");
}

function printReport(title,content){
 let root=$("printRoot");if(!root){root=document.createElement("section");root.id="printRoot";document.body.appendChild(root)}
 root.innerHTML=`<h1>${esc(title)}</h1><div class="print-meta">MSPS · Generated ${new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"})} (IST)</div>${content}`;
 // Keep the prepared report in the DOM until the next print. Android's native
 // PrintManager captures the WebView asynchronously after this call.
 setTimeout(()=>{try{if(window.AMUAndroidPrint&&typeof window.AMUAndroidPrint.print==="function"){window.AMUAndroidPrint.print()}else{window.print()}}catch(e){msg($("panelMsg"),"Printing is not available here. Open the website in Chrome and choose Print.","err")}},180);
}
function printCurrentReport(title,elementId){const el=$(elementId);if(!el){msg($("panelMsg"),"There is no report to print yet.","err");return}printReport(title,el.innerHTML)}

al);$("changeCommonPin").addEventListener("click",()=>openMiniModal(modal));$("cancelChangePin").addEventListener("click",()=>closeMiniModal(modal));$("changePinForm").addEventListener("submit",async e=>{e.preventDefault();const currentPin=$("currentCommonPin").value.trim(),newPin=$("newCommonPin").value.trim(),confirmPin=$("confirmCommonPin").value.trim();if(!/^\d{4,12}$/.test(currentPin)||!/^\d{4,12}$/.test(newPin)){msg($("panelMsg"),"PINs must contain 4–12 digits.","err");return}if(newPin!==confirmPin){msg($("panelMsg"),"New PIN and confirmation do not match.","err");return}if(currentPin===newPin){msg($("panelMsg"),"New PIN must be different from the current PIN.","err");return}const save=e.target.querySelector('button[type="submit"]');save.disabled=true;save.textContent="Saving…";try{await api({action:"set_common_pin",current_pin:currentPin,pin:newPin});closeMiniModal(modal);e.target.reset();msg($("panelMsg"),"Common PIN changed successfully.","ok")}catch(err){msg($("panelMsg"),err.message,"err")}finally{save.disabled=false;save.textContent="Save PIN"}});refreshEmailStatus()}
function backupPanel(){showPanel("backup","Backup & Restore",`<h3>Current Student Balances</h3><div class="actions"><button class="btn" id="printBalances" type="button">Print Current Balances</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Complete Website Backup</h3><button class="btn" id="downloadBackup">Download Backup (JSON)</button><p class="muted">Includes student, event, contribution, handover, transaction and settings data. PIN/security credentials are excluded.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Validate Backup File</h3><div class="field"><label>Choose backup file from your phone</label><input id="restoreFile" type="file" accept=".json,application/json"></div><div class="actions"><button class="btn secondary" id="validateBackup" disabled>Validate Backup</button><button class="btn danger" id="restoreBackup" disabled aria-disabled="true">Replace with Backup</button></div><div id="restorePreview" class="notice">Choose a JSON backup file, then press Validate Backup. Validation does not change database data.</div><div class="notice" style="margin-top:10px">Restore uses exact REPLACEMENT mode: it replaces students, events, student transactions, event contributions, event handovers and warden transactions with the backup. It replaces only the system_name, currency and currency_symbol settings. Warden/login accounts, Common PIN/security settings and logs are not changed. The secure database restore function must be installed before restoring.</div>`)}

function extractBackupTables(input){if(!input||typeof input!=="object"||Array.isArray(input))throw new Error("The JSON root must be an object.");let candidate=input.tables&&typeof input.tables==="object"?input.tables:(input.data&&typeof input.data==="object"?input.data:input);if(candidate.tables&&typeof candidate.tables==="object")candidate=candidate.tables;return candidate}
function normalizeBackupPayload(input){const source=extractBackupTables(input);const required=["students","events","student_transactions","event_contributions","event_handovers","warden_transactions","system_settings"];const tables={};for(const key of required){const value=source[key];if(key==="system_settings"&&value&&typeof value==="object"&&!Array.isArray(value)){tables[key]=value;continue}if(!Array.isArray(value))throw new Error("Backup is missing a valid "+key+" section.");tables[key]=value}const record_counts=input.record_counts||Object.fromEntries(Object.entries(tables).map(([key,value])=>[key,Array.isArray(value)?value.length:Object.keys(value||{}).length]));return {backup_format:input.backup_format||"MSPS_BACKUP_V2",backup_version:input.backup_version||2,exported_at:input.exported_at||input.exportedAt||new Date().toISOString(),record_counts,tables:tables}}
function balanceRows(){return students.map(s=>({name:s.name,student_code:s.student_code,class:s.class||"",current_balance:Number(s.current_balance||0)}))}
async function wardenPanel(){
 showPanel("warden","Warden Utilization & Repayment",`<form id="wardenForm"><div class="field"><label>Transaction type</label><select id="wardenType"><option value="utilization">Utilization</option><option value="repayment">Repayment</option></select></div><div class="row">${field("Amount (₹)","wardenAmount","Amount","number")}<div class="field"><label>Optional note</label><textarea id="wardenDescription" placeholder="Add a note (optional)"></textarea></div></div><div class="field"><label>Common PIN</label><input id="wardenPin" type="password" inputmode="numeric" required></div><button class="btn">Save transaction</button></form><div id="wardenSummary"></div>`);
 const o=await reports({action:"dashboard"});const w=o.warden_outstanding||{};$("wardenSummary").innerHTML=`<div class="metric" style="margin-top:12px"><span>Current outstanding</span><strong>${money(w.outstanding_amount)}</strong><span>Total utilized ${money(w.total_utilization)} · Repaid ${money(w.total_repaid)}</span></div>`;

 const d=await reports({action:"daily_report",date:today()});const rows=d.warden_transactions||[];

}
document.addEventListener("click",async ev=>{
 const tile=ev.target.closest("[data-panel]");if(tile){await openPanel(tile.dataset.panel);return}
 const action=ev.target.closest("[data-action]")?.dataset.action;if(!action)return;
 try{
  if(action.startsWith("txn:")){const [,id,type]=action.split(":");const s=students.find(x=>x.student_id===id);const label=type==="deposit"?"Deposit":type==="withdrawal"?"Withdrawal":"Borrow";showPanel("students",`${label} — ${s?.name||"Student"}`,`<form id="studentTxnForm"><input type="hidden" id="txnStudentId" value="${esc(id)}"><input type="hidden" id="txnType" value="${esc(type)}"><div class="field"><label>Amount (₹)</label><input id="txnAmount" type="number" min="0.01" step="0.01" required placeholder="Enter amount"></div><div class="field"><label>Optional note</label><textarea id="txnDescription" placeholder="Add a note (optional)"></textarea></div><div class="field"><label>Common PIN</label><input id="txnPin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" required placeholder="Enter Common PIN"></div><div class="actions"><button class="btn" type="submit">Confirm ${label}</button><button class="btn secondary" type="button" id="cancelTxn">Cancel</button></div></form>`);return}
  if(action.startsWith("edit:")){const id=action.split(":")[1];const s=students.find(x=>x.student_id===id);if(!s)throw new Error("Student not found.");showPanel("students",`Edit student: ${s.name}`,`<form id="editStudentForm"><input type="hidden" id="editStudentId" value="${esc(id)}"><div class="field"><label>Student name</label><input id="editStudentName" value="${esc(s.name)}" required></div><div class="field"><label>Class</label><input id="editStudentClass" value="${esc(s.class||"")}" required></div><div class="field"><label>Unique Student ID</label><input id="editStudentCode" value="${esc(s.student_code)}" required></div><div class="actions"><button class="btn" type="submit">Save changes</button><button class="btn secondary" type="button" id="cancelEdit">Cancel</button></div></form><div class="notice">Student profile editing updates only the student's name, class and unique ID. Financial history is not changed.</div>`);return}
  if(action.startsWith("statement:")){const id=action.split(":")[1];const student=students.find(x=>x.student_id===id);if(!student)throw new Error("Student not found.");const requestSerial=++statementRequestSerial;window.__mspsStatementRequest=requestSerial;showPanel("students",`Statement: ${student.name}`,`<div class="actions"><button class="btn secondary" id="printStudentStatement" type="button" disabled>Print statement</button></div><div id="studentStatementPrintable"><div class="notice">Loading student statement…</div></div>`);loadStudentStatement(id,requestSerial,student);return}
  if(action.startsWith("balance:")){const s=students.find(x=>x.student_id===action.split(":")[1]);if(!s)throw new Error("Student not found.");showPanel("students",`Current Balance — ${s.name}`,`<div class="metric"><span>${esc(s.student_code)} · ${esc(s.class||"")}</span><strong>${money(s.current_balance)}</strong></div>`);return}
  if(action.startsWith("eventreport:")){await eventReport(action.split(":")[1]);return}
  if(action.startsWith("handover:")){const id=action.split(":")[1];const amount=prompt("Handover amount (₹):");if(amount===null)return;if(!Number.isFinite(Number(amount))||Number(amount)<=0)throw new Error("Enter a valid positive amount.");const recipient=prompt("Recipient name (optional):")||"";const description=prompt("Description (optional):")||"";const pin=pinPrompt();if(pin===null)return;await api({action:"event_handover",pin,event_id:id,amount:Number(amount),recipient_name:recipient,description});alert("Event handover recorded.");await openPanel("events");return}
 }catch(e){msg($("panelMsg"),e.message,"err")}
});
$("panelBody").addEventListener("change",e=>{if(e.target.id==="restoreFile"){pendingRestorePayload=null;$("restoreBackup").disabled=true;$("restoreBackup").setAttribute("aria-disabled","true");const file=e.target.files?.[0];$("validateBackup").disabled=!file;$("restorePreview").textContent=file?`Selected: ${file.name}. Press Validate Backup to check the file.`:"Choose a JSON backup file, then press Validate Backup."}});

async function enter(user){$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=user.email||"Warden";try{await loadBase();showDashboardMetrics()}catch(e){alert("Dashboard connection error: "+e.message)}}
$("logout").onclick=async()=>{await sb.auth.signOut();$("app").classList.add("hidden");$("loginScreen").classList.remove("hidden")};
$("refresh").onclick=refresh;$("closePanel").onclick=closeTopPanel;
$("panelBody").addEventListener("input",e=>{
 if(e.target.id==="studentSearch")renderStudentTable();
 if(e.target.id==="contributionStudentSearch"){
  const q=e.target.value.trim().toLowerCase();
  const list=$("contributionStudentList");
  const rows=list?[...list.querySelectorAll(".student-choice")]:[];
  let matches=0;
  rows.forEach(row=>{
   const match=!!q&&row.textContent.toLowerCase().includes(q);
   row.style.display=match?"flex":"none";
   if(match)matches++;
  });
  const count=$("contributionStudentCount");
  if(count){
   const selected=rows.filter(row=>row.querySelector('input[type="checkbox"]')?.checked).length;
   count.textContent=!q
    ?"No students displayed. Search by name or student ID to find students."
    :(matches?`${matches} matching student(s) shown · ${selected} selected`:"No matching students found.");
  }
 }
});
$("panelBody").addEventListener("change",e=>{
 if(e.target.matches('#contributionStudentList input[type="checkbox"]')){
  const list=$("contributionStudentList");
  const rows=list?[...list.querySelectorAll(".student-choice")]:[];
  const selected=rows.filter(row=>row.querySelector('input[type="checkbox"]')?.checked).length;
  const count=$("contributionStudentCount");
  if(count){
   const q=$("contributionStudentSearch")?.value.trim();
   const matches=rows.filter(row=>row.style.display==="flex").length;
   count.textContent=q?`${matches} matching student(s) shown · ${selected} selected`:`${selected} selected. Search to display student names.`;
  }
 }
});
$("panelBody").addEventListener("submit",async e=>{
 e.preventDefault();try{
  if(e.target.id==="studentTxnForm"){const amount=Number($("txnAmount").value);if(!Number.isFinite(amount)||amount<=0)throw new Error("Enter a valid positive amount.");await api({action:"student_transaction",pin:$("txnPin").value,student_id:$("txnStudentId").value,transaction_type:$("txnType").value,amount,description:$("txnDescription").value.trim()});await loadBase();studentsPanel();msg($("panelMsg"),"Financial transaction saved successfully.");}
  if(e.target.id==="editStudentForm"){await api({action:"update_student",student_id:$("editStudentId").value,name:$("editStudentName").value.trim(),class:$("editStudentClass").value.trim(),student_code:$("editStudentCode").value.trim()});await loadBase();studentsPanel();msg($("panelMsg"),"Student details updated successfully.");}

  if(e.target.id==="eventForm"){await api({action:"add_event",event_name:$("eventName").value.trim(),description:$("eventDesc").value.trim()});await loadBase();showPanel("addEvent","Add Event","<div class=notice>Event created successfully.</div>");}
  if(e.target.id==="manualForm"){const pin=$("contributionPin").value;await api({action:"manual_event_contribution",pin,event_id:$("eventSelect").value,contributor_name:$("contributorName").value.trim(),amount:Number($("contributionAmount").value)});await loadBase();contributionPanel();msg($("panelMsg"),"Manual contribution saved successfully.");}
  if(e.target.id==="registeredContributionForm"){const student_ids=[...$("contributionStudentList").querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value);if(!student_ids.length)throw new Error("Select at least one registered student.");const amount=Number($("registeredContributionAmount").value);if(!Number.isFinite(amount)||amount<=0)throw new Error("Enter a valid positive contribution amount.");await api({action:"registered_event_contribution",event_id:$("registeredEventSelect").value,student_ids,amount,pin:$("registeredContributionPin").value,description:$("registeredContributionDescription").value.trim()});await loadBase();await contributionPanel();msg($("panelMsg"),`Contribution recorded for ${student_ids.length} student(s).`);}
  if(e.target.id==="transferForm"){const sender_id=$("transferSender").value,receiver_id=$("transferReceiver").value;if(sender_id===receiver_id)throw new Error("Sender and receiver must be different students.");const amount=Number($("transferAmount").value);if(!Number.isFinite(amount)||amount<=0)throw new Error("Enter a valid positive transfer amount.");await api({action:"student_transfer",sender_id,receiver_id,amount,pin:$("transferPin").value,description:$("transferDescription").value.trim()});await loadBase();await openPanel("transfer");msg($("panelMsg"),"Student transfer completed successfully.");}
  if(e.target.id==="wardenForm"){await api({action:"warden_transaction",pin:$("wardenPin").value,transaction_type:$("wardenType").value,amount:Number($("wardenAmount").value),description:$("wardenDescription").value.trim()});await wardenPanel();msg($("panelMsg"),"Warden transaction saved successfully.");}
 }catch(x){msg($("panelMsg"),x.message,"err")}
});
$("panelBody").addEventListener("click",async e=>{
 if(e.target.id==="printFundHistory"){printCurrentReport("MSPS — Total Balance and Complete Transactions","fundReportPrintable");return}
 if(e.target.id==="printStudentStatement"){printCurrentReport("MSPS — Student Statement — "+$("panelTitle").textContent.replace(/^Statement:\s*/,""),"studentStatementPrintable");return}
 if(e.target.id==="printHistory"){const date=$("historyDate")?.value||today();printCurrentReport((activePanel==="deposits"?"Deposit":activePanel==="withdrawals"?"Withdrawal":"Borrowing")+" report — "+date,"historyResult");return}
 if(e.target.id==="printEventReport"){printCurrentReport("Event report — "+$("panelTitle").textContent,"eventReportPrintable");return}
 if(e.target.id==="refreshEmailStatus"){await refreshEmailStatus();return}
 if(e.target.id==="sendDailyEmail"||e.target.id==="sendBackupEmail"){
  const button=e.target;const isDaily=button.id==="sendDailyEmail";const original=button.textContent;button.disabled=true;button.textContent=isDaily?"Sending report…":"Sending backup…";
  try{const result=await invoke("amu-email-bridge",{action:isDaily?"send_daily_report":"send_backup"});msg($("panelMsg"),result.message||(isDaily?"Daily report email sent successfully.":"Backup email sent successfully."),"ok");await refreshEmailStatus()}
  catch(err){msg($("panelMsg"),(isDaily?"Daily report":"Backup")+" email failed: "+err.message,"err")}
  finally{button.disabled=false;button.textContent=original}
  return;
 }
 if(e.target.id==="cancelTxn"||e.target.id==="cancelEdit"){studentsPanel();return}
 if(e.target.id==="loadHistory"){try{await loadHistory(activePanel)}catch(x){msg($("panelMsg"),x.message,"err")}}
 if(e.target.id==="generateDaily"){try{const d=await reports({action:"daily_report",date:$("emailDate").value});$("dailyPreview").textContent=JSON.stringify(d,null,2)}catch(x){msg($("panelMsg"),x.message,"err")}}
 if(e.target.id==="validateBackup"){const file=$("restoreFile").files?.[0];const box=$("restorePreview");if(!file){box.textContent="Choose a backup file first.";return}try{const raw=await file.text();const parsed=JSON.parse(raw);pendingRestorePayload=normalizeBackupPayload(parsed);box.textContent="Backup validation successful. Seven data sections are present. REPLACEMENT mode will replace the six data tables and the three approved system settings with the backup.";box.style.background="#ecfdf3";box.style.color="#067647";$("restoreBackup").disabled=false;$("restoreBackup").removeAttribute("aria-disabled")}catch(err){pendingRestorePayload=null;$("restoreBackup").disabled=true;box.textContent="Backup validation failed: "+err.message;box.style.background="#fef2f2";box.style.color="#b42318"}}
 if(e.target.id==="downloadBackup"){
    const button=e.target;
    const originalText=button.textContent;
    button.disabled=true;
    button.textContent="Preparing backup...";
    try{
      const d=await reports({action:"backup_export"});
      const compatibleBackup=normalizeBackupPayload(d);
      const json=JSON.stringify(compatibleBackup,null,2);
      const filename="MSPS_Backup_"+today()+".json";
      if(window.AMUAndroidPrint&&typeof window.AMUAndroidPrint.saveBackup==="function"){
        const bytes=new TextEncoder().encode(json);let binary="";for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
        window.__mspsBackupSaved=(ok)=>{msg($("panelMsg"),ok?"Backup saved to your phone's Downloads folder as "+filename:"Android could not save the backup. Please open the website in Chrome and download it there.",ok?"ok":"err");delete window.__mspsBackupSaved};
        window.AMUAndroidPrint.saveBackup(btoa(binary),filename);
        msg($("panelMsg"),"Saving backup to your phone…","ok");
        return;
      }
      // Data URLs avoid URL.createObjectURL(), unavailable in some Android
      // in-app browsers and embedded web views.
      let downloadUrl="data:application/json;charset=utf-8,"+encodeURIComponent(json);
      let objectUrl=null;
      try{if(window.URL&&typeof window.URL.createObjectURL==="function"){objectUrl=window.URL.createObjectURL(new Blob([json],{type:"application/json"}));downloadUrl=objectUrl}}catch(_){ }
      const a=document.createElement("a");
      a.href=downloadUrl;
      a.download=filename;
      a.style.display="none";
      document.body.appendChild(a);
      try{a.click();}finally{a.remove();if(objectUrl&&window.URL&&typeof window.URL.revokeObjectURL==="function")setTimeout(()=>window.URL.revokeObjectURL(objectUrl),1500)}
      msg($("panelMsg"),"Backup prepared. Check your browser's Downloads folder for "+filename+". If it did not download, open this page in Chrome and try again.","ok");
    }catch(x){
      msg($("panelMsg"),"Backup download failed: "+x.message,"err");
    }finally{
      button.disabled=false;
      button.textContent=originalText;
    }
  }
 if(e.target.id==="printBalances"){const rows=balanceRows();const html=`<table><thead><tr><th>Student</th><th>Student ID</th><th>Class</th><th>Current Balance</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.student_code)}</td><td>${esc(r.class)}</td><td>${money(r.current_balance)}</td></tr>`).join("")}</tbody></table><p>Total students: ${rows.length}</p>`;printReport("MSPS — Current Student Balances",html);return}
 if(e.target.id==="restoreBackup"){
  if(!pendingRestorePayload){msg($("panelMsg"),"Choose and validate a backup file first.","err");return}
  const ok=confirm("WARNING: EXACT REPLACEMENT RESTORE\\n\\nThis will DELETE and replace all existing records in students, events, student_transactions, event_contributions, event_handovers and warden_transactions with the records in this backup. It will replace only system_name, currency and currency_symbol in system_settings.\\n\\nWarden/login accounts, Common PIN/security settings and logs will NOT be changed.\\n\\nThe database operation is atomic: if any validation or insert fails, the database transaction will roll back.\\n\\nContinue with exact replacement?");
  if(!ok)return;
  const b=e.target;
  b.disabled=true;
  const old=b.textContent;
  b.textContent="Replacing data...";
  try{
    const result=await reports({action:"restore_import",tables:pendingRestorePayload.tables});
    if(result===null||result===undefined||result?.success===false){
      throw new Error(result?.error||"The server did not confirm the restore.");
    }
    const counts=result.restored||result.record_counts||result.counts||result;
    msg($("panelMsg"),"Exact replacement restore completed. Restored counts: "+JSON.stringify(counts),"ok");
    pendingRestorePayload=null;
    const fileInput=$("restoreFile");
    if(fileInput)fileInput.value="";
    await loadBase();
    showDashboardMetrics();
    const preview=$("restorePreview");
    if(preview)preview.textContent="Exact replacement completed successfully. The database now contains the backup records. You can close this panel.";
  }catch(err){
    msg($("panelMsg"),"Restore failed: "+(err?.message||String(err)),"err");
    const preview=$("restorePreview");
    if(preview)preview.textContent="Restore failed. The database transaction should have rolled back. Correct the reported issue before trying again.";
  }finally{
    b.textContent=old;
    b.disabled=!pendingRestorePayload;
  }
}

});
// Installable Android PWA shell. Only static app files are cached; API and financial data are never cached.
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
 navigator.serviceWorker.register("./service-worker.js").catch(err=>console.warn("AMU offline shell registration failed",err));
}

(async()=>{
  $("app").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==="SIGNED_OUT"){
      $("app").classList.add("hidden");
      $("loginScreen").classList.remove("hidden");
      $("password").value="";
    }
  });
})();
})();
